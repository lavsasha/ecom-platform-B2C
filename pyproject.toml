[project]
name = "ecom-platform"
version = "0.1.0"
description = "B2C part of the handmade marketplace platform"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the documented idiom
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["common.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["libs"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: pure logic, no external services",
    "integration: HTTP/ASGI against services (PostgreSQL for data services)",
    "validation: API envelopes and contract DTO rules",
    "b2c: integration tests for the b2c gateway",
]

[tool.coverage.run]
source = ["libs/common", "services"]
omit = ["**/tests/**", "deploy/**"]

[tool.coverage.report]
show_missing = true
skip_empty = true
